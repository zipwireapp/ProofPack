# Publish ProofPack JavaScript packages to npm when a v*-javascript tag is pushed.
#
# Uses npm trusted publishing (OIDC): no NPM_TOKEN and no OTP. Each package must have this repository and this
# workflow file registered as a Trusted Publisher on npmjs.com (package Settings > Trusted Publisher > GitHub Actions:
# owner zipwireapp, repository ProofPack, workflow release-javascript.yml). See docs/SHIPPING.md.

name: Release JavaScript

on:
  push:
    tags:
      - 'v*-javascript'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@^11.5.1

      # npm ci cannot be used yet: javascript/package-lock.json is out of sync with the workspaces
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: javascript

      - name: Test
        run: npm test
        working-directory: javascript

      - name: Build
        run: npm run build
        working-directory: javascript

      # A version already on the registry is skipped, so a failed run can be re-run without re-publishing
      - name: Publish @zipwire/proofpack
        run: |
          SPEC="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$SPEC" version > /dev/null 2>&1; then
            echo "$SPEC is already published; skipping"
          else
            npm publish
          fi
        working-directory: javascript/packages/base

      - name: Publish @zipwire/proofpack-ethereum
        run: |
          SPEC="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$SPEC" version > /dev/null 2>&1; then
            echo "$SPEC is already published; skipping"
          else
            npm publish
          fi
        working-directory: javascript/packages/ethereum

      - name: Create GitHub release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=${VERSION%-javascript}
          gh release create "$GITHUB_REF_NAME" \
            --title "ProofPack JavaScript v${VERSION}" \
            --notes-file javascript/CHANGELOG.md \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
